<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Administración | Lic. Lilibeth Navarrete</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>

    <div id="login-section" class="login-container">
        <h2>Acceso Administrativo</h2>
        <form id="login-form">
            <div class="form-group">
                <label for="username">Usuario</label>
                <input type="text" id="username" required placeholder="Usuario">
            </div>
            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>
            <button type="submit" class="btn-login">Entrar</button>
        </form>
    </div>

    <div id="dashboard">
        <div class="dashboard-header">
            <h2>Mensajes de Clientes</h2>
            <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
        </div>
        <table>
            <thead>
                <tr>
                    <th>Fecha</th>
                    <th>Cliente</th>
                    <th>Área</th>
                    <th>WhatsApp</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody id="solicitudes-body"></tbody>
        </table>
        <p id="solicitudes-vacio" class="solicitudes-vacio">Aún no hay solicitudes del Filtro Legal.</p>
    </div>

    <script src="store.js"></script>
    <script src="admin-solicitudes.js"></script>

    <script>
        const loginForm = document.getElementById('login-form');
        const loginSection = document.getElementById('login-section');
        const dashboard = document.getElementById('dashboard');

        loginForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const user = document.getElementById('username').value;
            const pass = document.getElementById('password').value;

            if (user === 'AbogadosNR' && pass === 'MLNR2000') {
                loginSection.style.display = 'none';
                dashboard.style.display = 'block';
                document.body.style.alignItems = 'flex-start';
                document.body.style.paddingTop = '5rem';
            } else {
                alert('Credenciales incorrectas. Por favor, intente de nuevo.');
            }
        });

        function logout() {
            dashboard.style.display = 'none';
            loginSection.style.display = 'block';
            document.body.style.alignItems = 'center';
            document.body.style.paddingTop = '0';
            loginForm.reset();
        }
    </script>
</body>
</html>
